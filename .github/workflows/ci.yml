name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Python ${{ matrix.python-version }} / Chromium
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Install matching Playwright Chromium and Linux dependencies
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Type-check source and adapter contracts
        run: uv run --no-sync mypy src tests/contract tests/smoke/test_live_tinytroupe.py

      - name: Check all generated schemas and canonical example
        run: >-
          uv run --no-sync pytest
          tests/unit/config/test_phase2a.py::test_loads_the_canonical_example
          tests/unit/config/test_validation.py::test_checked_in_schema_matches_generated_contract
          tests/unit/domain/test_contracts.py::test_artifact_schemas_match_generated_output

      - name: Verify direct dependency license inventory
        run: uv run --no-sync python scripts/license_inventory.py

      - name: Test (including Chromium integration and offline CLI examples)
        run: >-
          uv run --no-sync pytest
          --deselect=tests/unit/config/test_phase2a.py::test_loads_the_canonical_example
          --deselect=tests/unit/config/test_validation.py::test_checked_in_schema_matches_generated_contract
          --deselect=tests/unit/domain/test_contracts.py::test_artifact_schemas_match_generated_output

      - name: Build distributions
        run: uv build --clear --out-dir "$RUNNER_TEMP/syntheticcx-dist"

      - name: Inspect archives and clean-install wheel and sdist-derived wheel
        run: uv run --no-sync python scripts/verify_distribution.py "$RUNNER_TEMP/syntheticcx-dist"

      - name: Remove test-generated logs
        if: always()
        run: find . -maxdepth 1 -type f -name '*.log' -delete
