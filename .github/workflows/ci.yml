name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Python ${{ matrix.python-version }} / Chromium
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Install matching Playwright Chromium and Linux dependencies
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Test (including real-browser fixture)
        run: uv run --no-sync pytest

      - name: Lint and format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Type-check and schema parity
        run: |
          uv run --no-sync mypy src
          uv run --no-sync pytest tests/unit/config/test_validation.py::test_checked_in_schema_matches_generated_contract

      - name: Build distributions
        run: uv build

      - name: Remove test-generated logs
        if: always()
        run: find . -maxdepth 1 -type f -name '*.log' -delete
