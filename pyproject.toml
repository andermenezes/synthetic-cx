[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[project]
name = "synthetic-cx"
version = "0.1.0"
description = "Open-source framework for simulating synthetic customers and evaluating real conversational customer journeys."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SyntheticCX contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "langgraph==1.2.11",
  "openai==2.54.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "playwright==1.62.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "PyYAML==6.0.3",
  "tinytroupe @ git+https://github.com/microsoft/TinyTroupe.git@a6244b358a1fe1c71bf751f7ba0f8dfa368ec5a4",
  "typer==0.27.2",
]

[project.optional-dependencies]
telemetry = ["opentelemetry-exporter-otlp==1.44.0"]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "ruff==0.16.7",
  "types-PyYAML==6.0.12.20250915",
]

[project.scripts]
synthetic-cx = "syntheticcx.cli:app"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "syntheticcx"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["syntheticcx"]
follow_imports = "skip"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
